[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewlab"
version = "0.1.2"
description = "CrewLab — multi-agent crews: one agent one task, meet and ship projects together"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CrewLab" }]
dependencies = [
  "PyYAML>=6.0",
]
keywords = ["hermes", "multi-agent", "crew", "orchestration", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
crewlab = "crewlab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["crewlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
